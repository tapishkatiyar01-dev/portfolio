<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep night sky gradient: near-black at top, deep indigo/blue at horizon -->
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="30%" stop-color="#060d1a"/>
      <stop offset="65%" stop-color="#0c1e3a"/>
      <stop offset="100%" stop-color="#112244"/>
    </linearGradient>

    <!-- Milky Way band gradient -->
    <linearGradient id="milky-way-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b7fcf" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7b9de8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#a8bff5" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#7b9de8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5b7fcf" stop-opacity="0"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#c8d8ff" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#8aaae0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4466aa" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon surface -->
    <radialGradient id="moon-surf" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="60%" stop-color="#dce8ff"/>
      <stop offset="100%" stop-color="#b8ccf0"/>
    </radialGradient>

    <!-- Cloud glow (edge-lit by moon) -->
    <radialGradient id="cloud-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8aaae0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#112244" stop-opacity="0"/>
    </radialGradient>

    <!-- Star sparkle filter -->
    <filter id="star-blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow filter -->
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Cloud blur -->
    <filter id="cloud-blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="scene-clip">
      <rect width="1440" height="900"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene-clip)">

    <!-- Sky background -->
    <rect width="1440" height="900" fill="url(#sky-grad)"/>

    <!-- Milky Way band — diagonal soft luminance -->
    <ellipse cx="900" cy="200" rx="520" ry="700" fill="url(#milky-way-grad)" transform="rotate(-32 900 200)"/>
    <ellipse cx="840" cy="160" rx="380" ry="500" fill="url(#milky-way-grad)" opacity="0.6" transform="rotate(-32 840 160)"/>

    <!-- ── Stars — 3 tiers of brightness ── -->
    <!-- Tier 3: faint pin-points (many) -->
    <g fill="#c8d8ff" opacity="0.45" filter="url(#star-blur)">
      <circle cx="42" cy="28" r="0.6"/><circle cx="110" cy="14" r="0.5"/><circle cx="178" cy="42" r="0.7"/>
      <circle cx="255" cy="22" r="0.5"/><circle cx="318" cy="55" r="0.6"/><circle cx="380" cy="18" r="0.5"/>
      <circle cx="432" cy="38" r="0.7"/><circle cx="495" cy="60" r="0.5"/><circle cx="548" cy="28" r="0.6"/>
      <circle cx="612" cy="14" r="0.5"/><circle cx="665" cy="48" r="0.6"/><circle cx="720" cy="22" r="0.7"/>
      <circle cx="782" cy="35" r="0.5"/><circle cx="835" cy="12" r="0.6"/><circle cx="898" cy="44" r="0.5"/>
      <circle cx="942" cy="68" r="0.7"/><circle cx="1005" cy="20" r="0.5"/><circle cx="1058" cy="38" r="0.6"/>
      <circle cx="1112" cy="15" r="0.5"/><circle cx="1168" cy="52" r="0.7"/><circle cx="1220" cy="28" r="0.5"/>
      <circle cx="1285" cy="40" r="0.6"/><circle cx="1335" cy="18" r="0.5"/><circle cx="1388" cy="55" r="0.6"/>
      <circle cx="68" cy="72" r="0.5"/><circle cx="142" cy="85" r="0.6"/><circle cx="205" cy="65" r="0.5"/>
      <circle cx="278" cy="90" r="0.7"/><circle cx="345" cy="75" r="0.5"/><circle cx="415" cy="92" r="0.6"/>
      <circle cx="478" cy="78" r="0.5"/><circle cx="535" cy="95" r="0.7"/><circle cx="598" cy="82" r="0.5"/>
      <circle cx="652" cy="105" r="0.6"/><circle cx="715" cy="88" r="0.5"/><circle cx="768" cy="112" r="0.7"/>
      <circle cx="825" cy="92" r="0.5"/><circle cx="882" cy="108" r="0.6"/><circle cx="935" cy="78" r="0.5"/>
      <circle cx="988" cy="115" r="0.7"/><circle cx="1048" cy="85" r="0.5"/><circle cx="1102" cy="100" r="0.6"/>
      <circle cx="1158" cy="75" r="0.5"/><circle cx="1215" cy="95" r="0.7"/><circle cx="1268" cy="68" r="0.5"/>
      <circle cx="1322" cy="105" r="0.6"/><circle cx="1378" cy="82" r="0.5"/><circle cx="1412" cy="92" r="0.7"/>
      <circle cx="88" cy="125" r="0.6"/><circle cx="158" cy="148" r="0.5"/><circle cx="222" cy="132" r="0.7"/>
      <circle cx="295" cy="155" r="0.5"/><circle cx="358" cy="140" r="0.6"/><circle cx="425" cy="165" r="0.5"/>
      <circle cx="488" cy="128" r="0.7"/><circle cx="552" cy="158" r="0.5"/><circle cx="615" cy="142" r="0.6"/>
      <circle cx="678" cy="168" r="0.5"/><circle cx="738" cy="135" r="0.7"/><circle cx="798" cy="152" r="0.5"/>
      <circle cx="858" cy="170" r="0.6"/><circle cx="918" cy="138" r="0.5"/><circle cx="978" cy="162" r="0.7"/>
      <circle cx="1038" cy="145" r="0.5"/><circle cx="1098" cy="168" r="0.6"/><circle cx="1155" cy="132" r="0.5"/>
      <circle cx="1212" cy="158" r="0.7"/><circle cx="1268" cy="142" r="0.5"/><circle cx="1325" cy="165" r="0.6"/>
      <circle cx="1382" cy="128" r="0.5"/><circle cx="1422" cy="152" r="0.7"/>
      <!-- More rows -->
      <circle cx="30" cy="188" r="0.5"/><circle cx="95" cy="202" r="0.6"/><circle cx="162" cy="215" r="0.5"/>
      <circle cx="228" cy="195" r="0.7"/><circle cx="298" cy="220" r="0.5"/><circle cx="365" cy="205" r="0.6"/>
      <circle cx="435" cy="225" r="0.5"/><circle cx="502" cy="192" r="0.7"/><circle cx="568" cy="218" r="0.5"/>
      <circle cx="635" cy="202" r="0.6"/><circle cx="702" cy="228" r="0.5"/><circle cx="765" cy="196" r="0.7"/>
      <circle cx="832" cy="215" r="0.5"/><circle cx="895" cy="200" r="0.6"/><circle cx="958" cy="228" r="0.5"/>
      <circle cx="1022" cy="205" r="0.7"/><circle cx="1085" cy="218" r="0.5"/><circle cx="1148" cy="195" r="0.6"/>
      <circle cx="1212" cy="225" r="0.5"/><circle cx="1275" cy="208" r="0.7"/><circle cx="1338" cy="195" r="0.5"/>
      <circle cx="1400" cy="215" r="0.6"/>
    </g>

    <!-- Tier 2: medium stars -->
    <g fill="#dde8ff" opacity="0.72" filter="url(#star-blur)">
      <circle cx="85" cy="48" r="1.1"/><circle cx="215" cy="18" r="1.0"/><circle cx="362" cy="62" r="1.2"/>
      <circle cx="488" cy="32" r="1.0"/><circle cx="608" cy="55" r="1.1"/><circle cx="722" cy="24" r="1.0"/>
      <circle cx="845" cy="68" r="1.2"/><circle cx="962" cy="38" r="1.0"/><circle cx="1082" cy="52" r="1.1"/>
      <circle cx="1198" cy="28" r="1.0"/><circle cx="1315" cy="62" r="1.2"/><circle cx="1418" cy="42" r="1.0"/>
      <circle cx="145" cy="108" r="1.1"/><circle cx="278" cy="92" r="1.0"/><circle cx="405" cy="118" r="1.2"/>
      <circle cx="528" cy="98" r="1.0"/><circle cx="648" cy="122" r="1.1"/><circle cx="768" cy="95" r="1.0"/>
      <circle cx="888" cy="115" r="1.2"/><circle cx="1008" cy="88" r="1.0"/><circle cx="1128" cy="112" r="1.1"/>
      <circle cx="1248" cy="92" r="1.0"/><circle cx="1368" cy="118" r="1.2"/>
      <circle cx="55" cy="168" r="1.0"/><circle cx="185" cy="155" r="1.1"/><circle cx="315" cy="178" r="1.2"/>
      <circle cx="445" cy="152" r="1.0"/><circle cx="575" cy="172" r="1.1"/><circle cx="705" cy="148" r="1.0"/>
      <circle cx="835" cy="168" r="1.2"/><circle cx="965" cy="155" r="1.0"/><circle cx="1095" cy="175" r="1.1"/>
      <circle cx="1225" cy="148" r="1.0"/><circle cx="1355" cy="165" r="1.2"/>
    </g>

    <!-- Tier 1: bright stars (few, with glow) -->
    <g filter="url(#glow-sm)">
      <circle cx="165" cy="38" r="1.8" fill="#ffffff" opacity="0.92"/>
      <circle cx="445" cy="22" r="2.0" fill="#e8f0ff" opacity="0.88"/>
      <circle cx="678" cy="58" r="1.6" fill="#ffffff" opacity="0.85"/>
      <circle cx="875" cy="32" r="2.2" fill="#fff5e8" opacity="0.9"/> <!-- warm bright star -->
      <circle cx="1095" cy="48" r="1.8" fill="#ffffff" opacity="0.88"/>
      <circle cx="1298" cy="25" r="2.0" fill="#e8f0ff" opacity="0.85"/>
      <circle cx="302" cy="112" r="1.6" fill="#ffffff" opacity="0.82"/>
      <circle cx="755" cy="88" r="1.8" fill="#fff5e8" opacity="0.86"/>
      <circle cx="1155" cy="105" r="1.6" fill="#ffffff" opacity="0.82"/>
    </g>

    <!-- ── Moon ── -->
    <!-- Outer halo -->
    <circle cx="1060" cy="165" r="130" fill="url(#moon-halo)" opacity="0.9"/>
    <!-- Mid halo -->
    <circle cx="1060" cy="165" r="70" fill="none" stroke="#a8c0f0" stroke-width="0.8" opacity="0.15"/>
    <!-- Moon disc -->
    <circle cx="1060" cy="165" r="48" fill="url(#moon-surf)" filter="url(#glow-sm)"/>
    <!-- Moon surface detail — subtle craters -->
    <circle cx="1048" cy="158" r="6" fill="#b8ccf0" opacity="0.25"/>
    <circle cx="1068" cy="172" r="4" fill="#b8ccf0" opacity="0.2"/>
    <circle cx="1055" cy="178" r="3" fill="#b8ccf0" opacity="0.15"/>

    <!-- ── Clouds (edge-lit by moon) ── -->
    <!-- Cloud cluster near moon — lit top edge -->
    <g opacity="0.88">
      <ellipse cx="980" cy="225" rx="180" ry="52" fill="#0d1f3a" filter="url(#cloud-blur)"/>
      <ellipse cx="1020" cy="208" rx="120" ry="35" fill="#162845" filter="url(#cloud-blur)"/>
      <ellipse cx="1100" cy="220" rx="145" ry="45" fill="#0d1f3a" filter="url(#cloud-blur)"/>
      <!-- bright lit edges -->
      <ellipse cx="980" cy="210" rx="175" ry="20" fill="#2a4878" opacity="0.28" filter="url(#cloud-blur)"/>
      <ellipse cx="1100" cy="205" rx="140" ry="18" fill="#2a4878" opacity="0.22" filter="url(#cloud-blur)"/>
    </g>

    <!-- Cloud cluster upper-left -->
    <g opacity="0.7">
      <ellipse cx="220" cy="180" rx="160" ry="40" fill="#0a1628" filter="url(#cloud-blur)"/>
      <ellipse cx="260" cy="165" rx="100" ry="28" fill="#142238" filter="url(#cloud-blur)"/>
      <ellipse cx="165" cy="175" rx="120" ry="32" fill="#0a1628" filter="url(#cloud-blur)"/>
    </g>

    <!-- Cloud wisp center-right -->
    <g opacity="0.55">
      <ellipse cx="1280" cy="260" rx="130" ry="32" fill="#0a1628" filter="url(#cloud-blur)"/>
      <ellipse cx="1320" cy="248" rx="85" ry="22" fill="#142238" filter="url(#cloud-blur)"/>
    </g>

    <!-- ── Atmospheric haze at horizon ── -->
    <linearGradient id="haze-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#112244" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a3560" stop-opacity="0.55"/>
    </linearGradient>
    <rect y="620" width="1440" height="280" fill="url(#haze-grad)"/>

    <!-- Blue atmospheric scatter at lower sky -->
    <ellipse cx="720" cy="820" rx="900" ry="180" fill="#0e2044" opacity="0.65"/>

  </g>
</svg>
